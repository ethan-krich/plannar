name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - uses: pnpm/action-setup@v4
      - run: vp install
      - run: vp check
      - run: vp run -r test
      - name: Publish packages
        run: |
          # Publish in dependency order: leaf packages first
          pnpm publish --filter @plannar/registry-metadata --provenance --no-git-checks
          pnpm publish --filter @plannar/core --provenance --no-git-checks
          pnpm publish --filter @plannar/export --provenance --no-git-checks
          pnpm publish --filter plannar --provenance --no-git-checks
