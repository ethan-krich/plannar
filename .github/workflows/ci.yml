name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      # postinstall packs @plannar/core (required so the root vite.config.ts
      # can be loaded) and builds the remaining packages.
      - run: vp install
      - run: vp check
      - run: vp run -r test
