name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      # @plannar/core must be built before any vp command can load the root
      # vite.config.ts, which imports from it via apps/editor/vite.shared.ts.
      - run: vp install
      - run: vp pack
        working-directory: packages/core
      - run: vp run -r build
      - run: vp check
      - run: vp run -r test
