packages:
  - .plannar
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  shadcn: ^4.7.0
  class-variance-authority: ^0.7.1
  tw-animate-css: ^1.4.0
  "@base-ui/react": ^1.4.1
  lucide-react: ^1.16.0
  next-themes: ^0.4.6
  sonner: ^2.0.7
  tailwindcss: ^4.1.6
  "@fontsource-variable/geist": ^5.2.8
  react-shiki: ^0.10.0
  shiki: ^4.1.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  msw: true
  esbuild: true
  sharp: true
